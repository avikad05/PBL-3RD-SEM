```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emergency Response Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #222;
        }

        .container {
            max-width: 650px;
            margin: 20px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #b42318;
            font-size: 26px;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            padding: 12px 16px;
            margin: 8px 4px 0 0;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            color: white;
        }

        .camera-btn {
            background: #b42318;
        }

        .capture-btn {
            background: #198754;
        }

        .upload-btn {
            background: #2457c5;
            display: inline-block;
            padding: 12px 16px;
            margin-top: 12px;
            border-radius: 7px;
            color: white;
            cursor: pointer;
        }

        .remove-btn {
            background: #555;
        }

        #camera, #photoPreview {
            display: none;
            width: 100%;
            max-height: 400px;
            margin-top: 15px;
            border-radius: 10px;
            background: #eee;
        }

        #status {
            margin-top: 15px;
            color: #444;
            overflow-wrap: anywhere;
        }

        .photo-section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }

        .submit-btn {
            width: 100%;
            margin-top: 25px;
            background: #b42318;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 17px;
                margin: 10px auto;
            }

            h1 {
                font-size: 22px;
            }

            button {
                width: 100%;
                margin: 7px 0;
            }

            .upload-btn {
                display: block;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚨 Emergency Response Dashboard</h1>

    <p>Report an emergency and attach a photo of the incident.</p>

    <form id="emergencyForm">

        <label for="location">Incident Location</label>
        <input
            type="text"
            id="location"
            placeholder="Enter location"
            required
        >

        <label for="emergencyType">Emergency Type</label>
        <input
            type="text"
            id="emergencyType"
            placeholder="Accident, Fire, Medical, Crime..."
            required
        >

        <label for="description">Incident Description</label>
        <textarea
            id="description"
            rows="4"
            placeholder="Describe the emergency"
            required
        ></textarea>

        <div class="photo-section">

            <h3>📸 Attach Incident Photo</h3>

            <button type="button" class="camera-btn"
                    id="openCamera">
                📷 Open Camera
            </button>

            <button type="button" class="capture-btn"
                    id="capturePhoto" hidden>
                📸 Capture Photo
            </button>

            <button type="button" class="remove-btn"
                    id="closeCamera" hidden>
                Close Camera
            </button>

            <video id="camera" autoplay playsinline muted></video>

            <canvas id="canvas" hidden></canvas>

            <label for="photoUpload" class="upload-btn">
                🖼️ Upload Photo from Gallery
            </label>

            <input
                type="file"
                id="photoUpload"
                accept="image/*"
                capture="environment"
                hidden
            >

            <img id="photoPreview" alt="Selected incident photo">

            <button type="button" id="removePhoto"
                    class="remove-btn" hidden>
                ❌ Remove Photo
            </button>

            <div id="status" role="status" aria-live="polite">
                No photo selected.
            </div>

        </div>

        <button type="submit" class="submit-btn">
            Submit Emergency Report
        </button>

    </form>

</div>

<script>
    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("photoPreview");
    const statusText = document.getElementById("status");

    const openCameraBtn = document.getElementById("openCamera");
    const captureBtn = document.getElementById("capturePhoto");
    const closeCameraBtn = document.getElementById("closeCamera");
    const uploadInput = document.getElementById("photoUpload");
    const removePhotoBtn = document.getElementById("removePhoto");

    let cameraStream = null;
    let photoBlob = null;
    let photoURL = null;

    function stopCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }

        video.srcObject = null;
        video.style.display = "none";

        captureBtn.hidden = true;
        closeCameraBtn.hidden = true;
        openCameraBtn.hidden = false;
    }

    function showPhoto(blob) {
        if (photoURL) {
            URL.revokeObjectURL(photoURL);
        }

        photoBlob = blob;
        photoURL = URL.createObjectURL(blob);

        preview.src = photoURL;
        preview.style.display = "block";
        removePhotoBtn.hidden = false;

        statusText.textContent = "Photo ready to attach to the report.";
    }

    openCameraBtn.addEventListener("click", async () => {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
            statusText.textContent =
                "Camera is not supported here. Open the website using HTTPS or upload a photo.";
            return;
        }

        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: "environment" } },
                audio: false
            });

            video.srcObject = cameraStream;
            video.style.display = "block";

            captureBtn.hidden = false;
            closeCameraBtn.hidden = false;
            openCameraBtn.hidden = true;

            statusText.textContent =
                "Camera is open. Capture the incident photo.";

        } catch (error) {
            statusText.textContent =
                "Camera access failed. Allow camera permission or upload a photo. " +
                error.message;
        }
    });

    captureBtn.addEventListener("click", () => {
        if (!cameraStream || !video.videoWidth) {
            statusText.textContent = "Camera is not ready yet.";
            return;
        }

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const context = canvas.getContext("2d");
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(blob => {
            if (!blob) {
                statusText.textContent = "Could not capture the photo.";
                return;
            }

            showPhoto(blob);
            stopCamera();
        }, "image/jpeg", 0.9);
    });

    closeCameraBtn.addEventListener("click", () => {
        stopCamera();
        statusText.textContent = "Camera closed.";
    });

    uploadInput.addEventListener("change", () => {
        const file = uploadInput.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
            statusText.textContent = "Please select an image file.";
            uploadInput.value = "";
            return;
        }

        stopCamera();
        showPhoto(file);
    });

    removePhotoBtn.addEventListener("click", () => {
        photoBlob = null;
        preview.removeAttribute("src");
        preview.style.display = "none";
        removePhotoBtn.hidden = true;
        uploadInput.value = "";

        if (photoURL) {
            URL.revokeObjectURL(photoURL);
            photoURL = null;
        }

        statusText.textContent = "Photo removed.";
    });

    document.getElementById("emergencyForm").addEventListener(
        "submit",
        event => {
            event.preventDefault();

            if (!photoBlob) {
                statusText.textContent =
                    "Please capture or upload an incident photo first.";
                return;
            }

            const report = {
                location: document.getElementById("location").value,
                emergencyType: document.getElementById("emergencyType").value,
                description: document.getElementById("description").value,
                photo: photoBlob
            };

            console.log("Demo report:", report);

            alert(
                "Demo report prepared successfully! " +
                "The photo is attached in the browser, but this demo does not save reports to a server."
            );
        }
    );

    window.addEventListener("beforeunload", stopCamera);
</script>

</body>
</html>
